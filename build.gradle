plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT'
    id 'maven-publish'
}

def properties = new Properties()
properties.load(new FileInputStream(file('gradle.properties')))

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

loom {
    minecraftVersion = properties['minecraft_version']
    runDir = "${projectDir}/run"
    accessWidenerPath = file('src/main/resources/accessWidener.txt').getAbsolutePath()
}

dependencies {
    minecraft "com.mojang:minecraft:${properties['minecraft_version']}"
    mappings "net.fabricmc:yarn:${properties['minecraft_version']}:v2"
    modImplementation "net.fabricmc:fabric-loader:${properties['loader_version']}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${properties['minecraft_version']}+0.91.0"
}

processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand [version: project.version]
    }
    into "build/resources/main"
}